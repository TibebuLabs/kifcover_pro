version: '3.9'

# ─── KifCover Pro — Single DB, 5 Services ────────────────────────────────────
#
#  All services share: kifdb (PostgreSQL 16)
#
#  svc-auth     (3001) — auth, OTP, JWT
#  svc-customer (3002) — users, KYC, quotes, policies, claims, payments
#  svc-insurer  (3003) — products, pricing rules
#  svc-partner  (3004) — partners, payouts, commissions
#  svc-admin    (3005) — audit logs, analytics, compliance
#
# ─────────────────────────────────────────────────────────────────────────────

x-pg-healthcheck: &pg-healthcheck
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U postgres"]
    interval: 5s
    timeout: 5s
    retries: 10

x-restart: &restart
  restart: unless-stopped

x-db-env: &db-env
  DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-kifcover123}@postgres:5432/kifdb

x-svc-common: &svc-common
  build:
    context: ..
    dockerfile: infrastructure/Dockerfile.service
  depends_on:
    postgres: { condition: service_healthy }
  <<: *restart

services:

  # ── Database ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    <<: *pg-healthcheck
    environment:
      POSTGRES_DB:       kifdb
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kifcover123}
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    <<: *restart

  # ── API Gateway ───────────────────────────────────────────────────────────
  gateway:
    <<: *svc-common
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.service
      args: { SERVICE: gateway }
    environment:
      JWT_SECRET:       ${JWT_SECRET:-super-secret-change-in-prod}
      JWT_EXPIRES_IN:   7d
      GATEWAY_PORT:     3000
      PORT:             3000
      SERVICE_HOST:     localhost
      AUTH_SVC_PORT:    3001
      CUSTOMER_SVC_PORT: 3002
      INSURER_SVC_PORT:  3003
      PARTNER_SVC_PORT:  3004
      ADMIN_SVC_PORT:    3005
      FRONTEND_URL:     http://localhost:4000
    ports: ["3000:3000"]
    depends_on:
      - svc-auth
      - svc-customer
      - svc-insurer
      - svc-partner
      - svc-admin

  # ── svc-auth ──────────────────────────────────────────────────────────────
  svc-auth:
    <<: *svc-common
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.service
      args: { SERVICE: svc-auth }
    environment:
      <<: *db-env
      JWT_SECRET:     ${JWT_SECRET:-super-secret-change-in-prod}
      JWT_EXPIRES_IN: 7d
      PORT:           3001
      NODE_ENV:       production

  # ── svc-customer ──────────────────────────────────────────────────────────
  svc-customer:
    <<: *svc-common
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.service
      args: { SERVICE: svc-customer }
    environment:
      <<: *db-env
      PORT:             3002
      SERVICE_HOST:     localhost
      INSURER_SVC_PORT: 3003
      PARTNER_SVC_PORT: 3004

  # ── svc-insurer ───────────────────────────────────────────────────────────
  svc-insurer:
    <<: *svc-common
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.service
      args: { SERVICE: svc-insurer }
    environment:
      <<: *db-env
      PORT: 3003

  # ── svc-partner ───────────────────────────────────────────────────────────
  svc-partner:
    <<: *svc-common
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.service
      args: { SERVICE: svc-partner }
    environment:
      <<: *db-env
      PORT:              3004
      SERVICE_HOST:      localhost
      CUSTOMER_SVC_PORT: 3002

  # ── svc-admin ─────────────────────────────────────────────────────────────
  svc-admin:
    <<: *svc-common
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.service
      args: { SERVICE: svc-admin }
    environment:
      <<: *db-env
      PORT:              3005
      SERVICE_HOST:      localhost
      CUSTOMER_SVC_PORT: 3002
      PARTNER_SVC_PORT:  3004
      INSURER_SVC_PORT:  3003

  # ── Web frontend ──────────────────────────────────────────────────────────
  web:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000/api/v1
    ports: ["4000:4000"]
    depends_on: [gateway]
    <<: *restart

volumes:
  pgdata:
