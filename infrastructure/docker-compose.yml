version: '3.9'

# ─── Shared base env for all microservices ────────────────────────────────────
x-svc-common: &svc-common
  restart: unless-stopped
  depends_on:
    postgres-auth:     { condition: service_healthy }
    postgres-users:    { condition: service_healthy }
    postgres-products: { condition: service_healthy }
    postgres-quotes:   { condition: service_healthy }
    postgres-policies: { condition: service_healthy }
    postgres-claims:   { condition: service_healthy }
    postgres-payments: { condition: service_healthy }
    postgres-kyc:      { condition: service_healthy }
    postgres-partners: { condition: service_healthy }
    postgres-analytics:{ condition: service_healthy }

x-pg-healthcheck: &pg-healthcheck
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U postgres"]
    interval: 5s
    timeout: 5s
    retries: 10

x-gateway-env: &gateway-env
  JWT_SECRET: ${JWT_SECRET:-super-secret-change-in-prod}
  JWT_EXPIRES_IN: 7d
  SERVICE_HOST: localhost
  GATEWAY_PORT: 3000
  PORT: 3000
  AUTH_SVC_PORT: 3001
  USERS_SVC_PORT: 3002
  PRODUCTS_SVC_PORT: 3003
  QUOTES_SVC_PORT: 3004
  POLICIES_SVC_PORT: 3005
  CLAIMS_SVC_PORT: 3006
  PAYMENTS_SVC_PORT: 3007
  KYC_SVC_PORT: 3008
  PARTNERS_SVC_PORT: 3009
  ANALYTICS_SVC_PORT: 3010
  FRONTEND_URL: http://localhost:4000

services:

  # ── 10 Postgres instances (one per service) ──────────────────────────────────

  postgres-auth:
    image: postgres:16-alpine
    <<: *pg-healthcheck
    environment: { POSTGRES_DB: kif_auth, POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kifcover123} }
    volumes: [pgdata-auth:/var/lib/postgresql/data]
    ports: ["5432:5432"]

  postgres-users:
    image: postgres:16-alpine
    <<: *pg-healthcheck
    environment: { POSTGRES_DB: kif_users, POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kifcover123} }
    volumes: [pgdata-users:/var/lib/postgresql/data]
    ports: ["5433:5432"]

  postgres-products:
    image: postgres:16-alpine
    <<: *pg-healthcheck
    environment: { POSTGRES_DB: kif_products, POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kifcover123} }
    volumes: [pgdata-products:/var/lib/postgresql/data]
    ports: ["5434:5432"]

  postgres-quotes:
    image: postgres:16-alpine
    <<: *pg-healthcheck
    environment: { POSTGRES_DB: kif_quotes, POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kifcover123} }
    volumes: [pgdata-quotes:/var/lib/postgresql/data]
    ports: ["5435:5432"]

  postgres-policies:
    image: postgres:16-alpine
    <<: *pg-healthcheck
    environment: { POSTGRES_DB: kif_policies, POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kifcover123} }
    volumes: [pgdata-policies:/var/lib/postgresql/data]
    ports: ["5436:5432"]

  postgres-claims:
    image: postgres:16-alpine
    <<: *pg-healthcheck
    environment: { POSTGRES_DB: kif_claims, POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kifcover123} }
    volumes: [pgdata-claims:/var/lib/postgresql/data]
    ports: ["5437:5432"]

  postgres-payments:
    image: postgres:16-alpine
    <<: *pg-healthcheck
    environment: { POSTGRES_DB: kif_payments, POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kifcover123} }
    volumes: [pgdata-payments:/var/lib/postgresql/data]
    ports: ["5438:5432"]

  postgres-kyc:
    image: postgres:16-alpine
    <<: *pg-healthcheck
    environment: { POSTGRES_DB: kif_kyc, POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kifcover123} }
    volumes: [pgdata-kyc:/var/lib/postgresql/data]
    ports: ["5439:5432"]

  postgres-partners:
    image: postgres:16-alpine
    <<: *pg-healthcheck
    environment: { POSTGRES_DB: kif_partners, POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kifcover123} }
    volumes: [pgdata-partners:/var/lib/postgresql/data]
    ports: ["5440:5432"]

  postgres-analytics:
    image: postgres:16-alpine
    <<: *pg-healthcheck
    environment: { POSTGRES_DB: kif_analytics, POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kifcover123} }
    volumes: [pgdata-analytics:/var/lib/postgresql/data]
    ports: ["5441:5432"]

  # ── API Gateway ────────────────────────────────────────────────────────────

  gateway:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.service
      args: { SERVICE: gateway }
    environment:
      <<: *gateway-env
    ports: ["3000:3000"]
    depends_on:
      - svc-auth
      - svc-users
      - svc-products
      - svc-quotes
      - svc-policies
      - svc-claims
      - svc-payments
      - svc-kyc
      - svc-partners
      - svc-analytics
    restart: unless-stopped

  # ── Microservices ──────────────────────────────────────────────────────────

  svc-auth:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.service
      args: { SERVICE: svc-auth }
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-kifcover123}@postgres-auth:5432/kif_auth
      JWT_SECRET: ${JWT_SECRET:-super-secret-change-in-prod}
      JWT_EXPIRES_IN: 7d
      PORT: 3001
    depends_on:
      postgres-auth: { condition: service_healthy }
    restart: unless-stopped

  svc-users:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.service
      args: { SERVICE: svc-users }
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-kifcover123}@postgres-users:5432/kif_users
      PORT: 3002
    depends_on:
      postgres-users: { condition: service_healthy }
    restart: unless-stopped

  svc-products:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.service
      args: { SERVICE: svc-products }
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-kifcover123}@postgres-products:5432/kif_products
      PORT: 3003
    depends_on:
      postgres-products: { condition: service_healthy }
    restart: unless-stopped

  svc-quotes:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.service
      args: { SERVICE: svc-quotes }
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-kifcover123}@postgres-quotes:5432/kif_quotes
      PORT: 3004
    depends_on:
      postgres-quotes: { condition: service_healthy }
    restart: unless-stopped

  svc-policies:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.service
      args: { SERVICE: svc-policies }
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-kifcover123}@postgres-policies:5432/kif_policies
      PORT: 3005
      USERS_SVC_PORT: 3002
      SERVICE_HOST: localhost
    depends_on:
      postgres-policies: { condition: service_healthy }
    restart: unless-stopped

  svc-claims:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.service
      args: { SERVICE: svc-claims }
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-kifcover123}@postgres-claims:5432/kif_claims
      PORT: 3006
    depends_on:
      postgres-claims: { condition: service_healthy }
    restart: unless-stopped

  svc-payments:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.service
      args: { SERVICE: svc-payments }
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-kifcover123}@postgres-payments:5432/kif_payments
      PORT: 3007
    depends_on:
      postgres-payments: { condition: service_healthy }
    restart: unless-stopped

  svc-kyc:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.service
      args: { SERVICE: svc-kyc }
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-kifcover123}@postgres-kyc:5432/kif_kyc
      PORT: 3008
    depends_on:
      postgres-kyc: { condition: service_healthy }
    restart: unless-stopped

  svc-partners:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.service
      args: { SERVICE: svc-partners }
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-kifcover123}@postgres-partners:5432/kif_partners
      PORT: 3009
    depends_on:
      postgres-partners: { condition: service_healthy }
    restart: unless-stopped

  svc-analytics:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.service
      args: { SERVICE: svc-analytics }
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-kifcover123}@postgres-analytics:5432/kif_analytics
      PORT: 3010
    depends_on:
      postgres-analytics: { condition: service_healthy }
    restart: unless-stopped

  # ── Web Frontend ───────────────────────────────────────────────────────────

  web:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000/api/v1
    ports: ["4000:4000"]
    depends_on: [gateway]
    restart: unless-stopped

volumes:
  pgdata-auth:
  pgdata-users:
  pgdata-products:
  pgdata-quotes:
  pgdata-policies:
  pgdata-claims:
  pgdata-payments:
  pgdata-kyc:
  pgdata-partners:
  pgdata-analytics:
