    <<: *pg-healthcheck
    environment: { POSTGRES_DB: kif_quotes, POSTGRES_USER: postgres, POSTGRES_PASSWORD: kifcover123 }
    volumes: [pgdata-quotes:/var/lib/postgresql/data]
    ports: ["5435:5432"]

  postgres-policies:
    image: postgres:16-alpine
    <<: *pg-healthcheck
    environment: { POSTGRES_DB: kif_policies, POSTGRES_USER: postgres, POSTGRES_PASSWORD: kifcover123 }
