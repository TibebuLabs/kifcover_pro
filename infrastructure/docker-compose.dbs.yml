    volumes: [pgdata-payments:/var/lib/postgresql/data]
    ports: ["5438:5432"]

  postgres-kyc:
    image: postgres:16-alpine
    <<: *pg-healthcheck
    environment: { POSTGRES_DB: kif_kyc, POSTGRES_USER: postgres, POSTGRES_PASSWORD: kifcover123 }
