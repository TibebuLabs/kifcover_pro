version: '3.9'
# ─────────────────────────────────────────────────────────────────────────────
# KifCover Pro — Standalone single-DB stack (dev / CI)
#
# Runs ONLY the PostgreSQL instance without microservices.
# Use this to run migrations and seed locally before starting services.
#
#   docker compose -f infrastructure/docker-compose.dbs.yml up -d
#   node infrastructure/migrate-all.js
#   yarn db:seed
# ─────────────────────────────────────────────────────────────────────────────

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_DB:       kifdb
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-13d2144}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  pgdata:
