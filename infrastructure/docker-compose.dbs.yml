  postgres-analytics:
    image: postgres:16-alpine
    <<: *pg-healthcheck
    environment: { POSTGRES_DB: kif_analytics, POSTGRES_USER: postgres, POSTGRES_PASSWORD: kifcover123 }
    volumes: [pgdata-analytics:/var/lib/postgresql/data]
