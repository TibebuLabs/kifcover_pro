version: '3.9'

x-pg-healthcheck: &pg-healthcheck
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U postgres"]
    interval: 5s
    timeout: 5s
    retries: 10

services:
  postgres-auth:
    image: postgres:16-alpine
    <<: *pg-healthcheck
    environment: { POSTGRES_DB: kif_auth, POSTGRES_USER: postgres, POSTGRES_PASSWORD: kifcover123 }
    volumes: [pgdata-auth:/var/lib/postgresql/data]
    ports: ["5432:5432"]

  postgres-users:
    image: postgres:16-alpine
    <<: *pg-healthcheck
    environment: { POSTGRES_DB: kif_users, POSTGRES_USER: postgres, POSTGRES_PASSWORD: kifcover123 }
    volumes: [pgdata-users:/var/lib/postgresql/data]
    ports: ["5433:5432"]

  postgres-products:
    image: postgres:16-alpine
    <<: *pg-healthcheck
    environment: { POSTGRES_DB: kif_products, POSTGRES_USER: postgres, POSTGRES_PASSWORD: kifcover123 }
